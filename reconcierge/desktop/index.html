<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>reConcierge Desktop Prototype r3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ground:#E3EAEC;--paper:#FFFFFF;--glass:rgba(255,255,255,.66);--ink:#0E1418;--sec:#3F4B53;--mute:#66727B;--hair:rgba(14,20,24,.09);--sky:#BCD8E6;
 --amber:#9A4A0B;--amber-bg:#FBEBDD;--amber-line:#E7B98F;--green:#1E5B3A;--green-bg:#DDEEE4;--indigo:#3B4A8C;--indigo-bg:#E4E7F5;--red:#8E2F2A;--red-bg:#F6E0DE;--stone:#5C6670;--stone-bg:#E6EAEC;--blue:#2F4F6E;--blue-bg:#DEE7EF;
 --sans:"Manrope",-apple-system,"SF Pro Text",system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
body.night{--ground:#11151B;--paper:#1C2129;--glass:rgba(28,33,41,.72);--ink:#EEF1F3;--sec:#B7C0C7;--mute:#98A3AC;--hair:rgba(238,241,243,.09);--sky:#1F4652;
 --amber:#E3A264;--amber-bg:#2A1D12;--amber-line:#6B4A2A;--green:#8FD1AE;--green-bg:#17301F;--indigo:#AEB7EA;--indigo-bg:#1F2440;--red:#EA9A94;--red-bg:#3A1E1C;--stone:#B4BDC4;--stone-bg:#252B31;--blue:#9CBBD6;--blue-bg:#1D2A36}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ambient{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 50% 40% at 22% 8%,var(--sky) 0%,transparent 65%)}
.app{position:relative;display:grid;grid-template-columns:232px minmax(0,1fr) auto;height:100%;gap:0}
/* rail */
.rail{padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--hair);background:var(--glass);backdrop-filter:blur(12px)}
.mark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;margin:0 6px 14px}
.mark .dot{width:22px;height:22px;border-radius:50%;background:var(--ink);position:relative}.mark .dot::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--ground)}
.rail h6{margin:14px 8px 4px;font-size:11.5px;font-weight:800;color:var(--mute);letter-spacing:.3px}
.rail button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--sec);padding:9px 10px;border-radius:12px;cursor:pointer;text-align:left;min-height:40px}
.rail button[aria-current=page]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 4px 14px rgba(14,20,24,.06)}
.rail button .n{margin-left:auto;font-size:12px;color:var(--mute);font-weight:700}
.rail .sub button{padding-left:22px;font-size:13.5px}
.rail .spacer{flex:1}
.rail .foot{font-size:11.5px;color:var(--mute);padding:8px}
.idm{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;position:relative}
.idm.wolf{border:2px solid var(--ink)}.idm.wolf::after{content:"";width:8px;height:8px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
.idm.conc{background:var(--ink)}.idm.conc::after{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--ground)}
.idm.gabi{background:var(--stone-bg);color:var(--ink);font-weight:800;font-size:11px}
.idm.lg{width:30px;height:30px}
/* main */
.main{overflow-y:auto;padding:22px 30px 60px;scrollbar-width:thin;container-type:inline-size;min-width:0}
.app.narrow .cols{grid-template-columns:1fr}.app.narrow .greet{font-size:36px}.app.narrow .filters{gap:6px}.app.narrow .entry{max-width:100%}
.app.tight .top{flex-wrap:wrap;gap:8px}.app.tight .row{flex-wrap:wrap}.app.tight .row .t{flex-basis:100%}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.top .meta{font-size:13px;color:var(--sec)}
.ring{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair);background:var(--glass);height:44px;padding:0 12px 0 9px;border-radius:999px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}
.ring i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block;position:relative}.ring i::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--ink);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.55}50%{transform:scale(1);opacity:1}}
.ring .cnt{color:var(--sec);font-weight:600}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--hair);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;color:var(--sec);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--ground)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--ground);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.greet{font-family:var(--serif);font-size:44px;line-height:1.05;margin:18px 0 8px;letter-spacing:-.4px}
.sit{font-size:20px;font-weight:700;margin:0 0 2px}.sit2{font-size:16px;color:var(--sec);margin:0 0 20px}
h1.pg{font-family:var(--serif);font-size:36px;font-weight:400;margin:14px 0 4px}
.lead{font-size:14px;color:var(--sec);margin:0 0 18px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.paper{background:var(--paper);border-radius:20px;box-shadow:0 8px 24px rgba(14,20,24,.06)}
body.night .paper{box-shadow:none;border:1px solid var(--hair)}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;min-height:56px;border-bottom:1px solid var(--hair);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:15px;line-height:1.3}.row .t span{display:block;font-size:13px;color:var(--sec);margin-top:2px}
.row .t .why2{font-size:12.5px;color:var(--sec);margin-top:3px}
.row .t .why2 b{color:var(--ink);font-weight:700}
.row .chev{color:var(--mute);font-size:18px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;letter-spacing:.4px;padding:4px 8px;border-radius:999px;white-space:nowrap;text-transform:uppercase}
.p-amber{background:var(--amber-bg);color:var(--amber)}.p-green{background:var(--green-bg);color:var(--green)}.p-indigo{background:var(--indigo-bg);color:var(--indigo);border:1px dashed var(--indigo)}.p-red{background:var(--red-bg);color:var(--red)}.p-stone{background:var(--stone-bg);color:var(--stone)}.p-blue{background:var(--blue-bg);color:var(--blue)}.p-ink{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.p-ready{background:transparent;color:var(--ink);border:1.5px solid var(--ink);text-transform:none;letter-spacing:0;font-size:12.5px}.p-ready::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.flag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--amber);border:1px solid var(--amber-line);border-radius:6px;padding:1px 6px}
.halo{box-shadow:0 0 0 1px var(--amber-line)}
.sec{margin-top:20px}.sec h4{font-size:12.5px;font-weight:800;color:var(--sec);margin:0 0 8px 2px}
.list{padding:4px 18px}.list .li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair);font-size:14px;line-height:1.4}.list .li:last-child{border-bottom:0}.list .li .k{color:var(--sec);width:64px;flex:none;font-size:12.5px;font-weight:700;padding-top:1px}.list .li .v{flex:1}
.ok{color:var(--green);font-weight:700}
.live{padding:14px 18px}.live .h{display:flex;justify-content:space-between;align-items:center}.live .h b{font-size:15px}.live .stage{font-size:13.5px;color:var(--sec);margin-top:3px}
.bar{height:4px;border-radius:2px;background:var(--hair);margin:10px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .6s}
.live .next{display:flex;justify-content:space-between;font-size:13px;color:var(--sec)}.live .next b{color:var(--ink)}
.reassure{margin:14px 2px 0;font-size:13.5px;color:var(--sec);cursor:pointer}.reassure b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font:inherit;font-weight:700;font-size:14px;padding:11px 18px;cursor:pointer;border:0;white-space:nowrap;min-height:40px}
.b-ink{background:var(--ink);color:var(--ground)}.b-out{background:var(--paper);color:var(--ink);border:1.5px solid var(--hair)}.b-red{background:var(--paper);color:var(--red);border:1.5px solid var(--red-bg)}.btn.sm{font-size:13px;padding:8px 14px;min-height:36px}.btn:disabled{opacity:.35;cursor:not-allowed}
/* entry */
.entry{display:flex;gap:6px;background:var(--paper);border:1px solid var(--hair);border-radius:999px;padding:4px;box-shadow:0 8px 24px rgba(14,20,24,.08);max-width:560px;margin:22px 0 0}
.entry button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;color:var(--ink);height:44px;border-radius:999px;cursor:pointer}
.entry button:first-child{border-right:1px solid var(--hair);border-radius:999px 0 0 999px}
.entry .mic{flex:0 0 46px;width:46px;border-radius:999px;background:var(--ink);color:var(--ground);border:0!important}
/* table */
.tblwrap{overflow-x:auto}
table{width:100%;min-width:760px;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:800;color:var(--mute);letter-spacing:.3px;padding:12px 14px;border-bottom:1px solid var(--hair)}
td{padding:12px 14px;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.4}
tr:last-child td{border-bottom:0}tr.click{cursor:pointer}tr.click:hover td{background:rgba(14,20,24,.02)}
td.mono{font-family:var(--mono);font-size:12.5px;color:var(--sec)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.chip{font-size:12.5px;font-weight:700;color:var(--sec);border:1px solid var(--hair);background:var(--paper);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
/* conversation panel */
.panel{width:min(420px,32vw);min-width:360px;border-left:1px solid var(--hair);background:var(--glass);backdrop-filter:blur(12px);display:flex;flex-direction:column;height:100%}
.panel.wide{width:min(640px,42vw);min-width:400px}
.chead{padding:18px 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--hair)}
.chead .who{flex:1;min-width:0}.chead .who b{display:block;font-size:15px}.chead .who span{display:block;font-size:12.5px;color:var(--sec)}
.marks{display:flex}.marks .idm{margin-left:-6px;box-shadow:0 0 0 2px var(--ground)}
.thread{flex:1;overflow-y:auto;padding:14px 16px 20px;scrollbar-width:thin}
.msg{display:flex;gap:9px;margin:10px 0;align-items:flex-start}.msg.me{justify-content:flex-end}
.msg .bub{max-width:86%;padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.45}
.msg.me .bub{background:var(--ink);color:var(--ground);border-bottom-right-radius:6px}.msg.ai .bub{background:var(--paper);border-bottom-left-radius:6px}
.msg .name{font-size:12.5px;font-weight:800;color:var(--sec);margin:0 0 4px}
.msg.ai.wide{display:block}.msg.ai.wide .bub{max-width:100%;border-radius:18px;border:1px solid var(--hair)}.msg.ai.wide .name{display:flex;align-items:center;gap:8px;color:var(--ink);margin-bottom:6px}
.msg.crit .bub{border-left:3px solid var(--ink);border-radius:6px 18px 18px 6px}.msg.crit .name::after{content:"review";font-size:12.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--sec);border-radius:6px;padding:1px 5px;margin-left:6px;color:var(--sec)}
.sys{text-align:center;font-size:12.5px;color:var(--sec);margin:14px 20px;line-height:1.45}.sys a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;margin-top:4px;color:var(--ink);font-weight:700;cursor:pointer;border:1px solid var(--hair);border-radius:999px;background:var(--paper)}
.layer{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--hair)}.layer .lab{font-size:12px;font-weight:800;letter-spacing:.4px;color:var(--sec);text-transform:uppercase;margin-bottom:5px}.layer .lab.rec{color:var(--ink)}.layer p{margin:0 0 5px;font-size:13.5px;line-height:1.4}
.card{background:var(--paper);border-radius:18px;padding:14px 16px;margin:10px 0;font-size:13.5px;border:1px solid var(--hair)}.card h5{margin:0 0 8px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.card .kv{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--hair);font-size:13px}.card .kv:first-of-type{border-top:0}.card .kv .k{color:var(--sec);width:80px;flex:none;font-weight:700;font-size:12.5px}
.composer{padding:10px 16px 18px;border-top:1px solid var(--hair)}.composer .box{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--hair);border-radius:999px;padding:8px 8px 8px 16px;font-size:14px;color:var(--mute)}.composer .box span{flex:1}.composer .box i{width:36px;height:36px;border-radius:50%;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;color:var(--ground)}
.ctx{padding:12px 16px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--sec)}.ctx b{display:block;color:var(--ink);font-size:11.5px;letter-spacing:.3px;margin:6px 0 2px}
.treas{background:var(--paper);border-radius:16px;border:1px solid var(--hair);padding:12px 14px;margin:10px 0;font-size:13.5px}.treas h5{margin:0 0 6px;font-size:12.5px;font-weight:800;display:flex;justify-content:space-between}.treas .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--hair)}.treas .kv span:last-child{font-variant-numeric:tabular-nums;font-weight:700}.treas .sig{font-size:12px;color:var(--sec);margin-top:8px}
.decided{background:var(--paper);border-radius:16px;padding:14px 16px;margin:10px 0;font-size:14px;border-left:3px solid var(--ink);line-height:1.45}
/* outcome sheet + seal modal */
.overlay{position:fixed;inset:0;background:rgba(14,20,24,.35);backdrop-filter:blur(6px);display:flex;justify-content:flex-end;z-index:20}
.sheet{width:560px;height:100%;background:var(--ground);overflow-y:auto;padding:26px 30px 40px;scrollbar-width:thin}
.modal{margin:auto;width:980px;max-height:92vh;display:grid;grid-template-columns:260px 1fr;gap:0;background:var(--paper);border-radius:24px;overflow:hidden}
.queue{border-right:1px solid var(--hair);padding:22px 18px;background:var(--ground)}
.queue h6{margin:0 0 10px;font-size:11.5px;font-weight:800;color:var(--mute);letter-spacing:.3px}
.qi{padding:12px 14px;border-radius:14px;background:var(--paper);margin-bottom:8px;font-size:13.5px;border:1.5px solid var(--hair)}.qi.cur{border-color:var(--amber-line);background:var(--amber-bg)}.qi span{display:block;font-size:12.5px;color:var(--sec);margin-top:2px}
.seal{padding:26px 30px 30px;overflow-y:auto;position:relative}
.seal h2{font-size:26px;margin:10px 0 4px;line-height:1.15;letter-spacing:-.3px}.seal .sub{font-size:14px;color:var(--sec)}
.seal .amt{font-size:36px;font-weight:800;letter-spacing:-.5px;margin:14px 0 2px;font-variant-numeric:tabular-nums}.seal .amt small{font-size:13px;font-weight:600;color:var(--sec);letter-spacing:0;margin-left:6px}
.seal .roles{font-size:12.5px;color:var(--sec);line-height:1.45;margin:8px 0 6px}
.kv2{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
.seal .kv{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--hair);font-size:13.5px}.seal .kv .k{width:100px;flex:none;color:var(--sec);font-weight:700;font-size:12.5px;padding-top:2px}.seal .kv .v{flex:1;line-height:1.4}
.risk{background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:600;margin-top:10px;line-height:1.35}
body.night .risk{color:#F0C9A4}
.actions{display:flex;gap:8px;align-items:center;margin-top:16px}
.auth{border:1.5px dashed var(--sec);border-radius:16px;padding:14px;text-align:center;font-size:13.5px;color:var(--sec);margin-top:12px}.auth b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.void{margin:-26px -30px 16px;padding:16px 30px;background:var(--red);color:#fff;font-size:14px;font-weight:700;line-height:1.4}.void small{display:block;font-weight:600;opacity:.9;margin-top:4px;font-size:12.5px}
.seal.isvoid .amt{text-decoration:line-through;color:var(--mute)}.seal.isvoid .kv,.seal.isvoid .risk,.seal.isvoid h2,.seal.isvoid .sub,.seal.isvoid .roles{opacity:.45}
.newseal{background:var(--amber-bg);border:1.5px solid var(--amber-line);color:var(--amber);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:700;margin:6px 0 10px}
.foot{font-size:12px;color:var(--sec);text-align:center;margin-top:10px;font-family:var(--mono)}
.tl{margin:14px 0 0}.tl .st{display:flex;gap:12px;padding:9px 0}.tl .st .n{width:20px;flex:none;display:flex;flex-direction:column;align-items:center}.tl .st .n i{width:12px;height:12px;border-radius:50%;border:2px solid var(--hair);background:var(--paper);display:block;margin-top:4px}
.tl .st.done .n i{background:var(--ink);border-color:var(--ink)}.tl .st.active .n i{border-color:var(--ink);box-shadow:0 0 0 3px var(--ground),0 0 0 4.5px var(--ink)}.tl .st .n::after{content:"";flex:1;width:2px;background:var(--hair);margin-top:4px}.tl .st:last-child .n::after{display:none}
.tl .st .b b{display:block;font-size:14.5px}.tl .st .b span{display:block;font-size:13px;color:var(--sec);margin-top:2px;line-height:1.4}.tl .st.future .b b{color:var(--mute);font-weight:600}
.evid{font-family:var(--mono);font-size:12px;color:var(--sec);line-height:1.7;margin-top:8px}
.demo{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 0;padding-top:12px;border-top:1px dashed var(--hair)}.demo small{width:100%;font-size:12px;color:var(--sec)}.demo button{border:1px dashed var(--sec);background:transparent;font:inherit;font-size:12px;font-weight:700;color:var(--sec);padding:8px 10px;border-radius:8px;cursor:pointer}
/* inside */
.map{padding:20px;overflow-x:auto}.map svg{width:100%;min-width:920px;height:auto;font-family:var(--sans);display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.mini{padding:4px 18px}.mini .li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13.5px}.mini .li:last-child{border-bottom:0}.mini .li span:last-child{color:var(--sec);font-family:var(--mono);font-size:12px;white-space:nowrap}
.reserved{border:1.5px dashed var(--hair);border-radius:16px;padding:16px;color:var(--sec);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:14px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:30}.toast.on{opacity:1;transform:translate(-50%,0)}
.ctlbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;z-index:25;opacity:.9}
.ctlbar button{border:1px dashed var(--sec);background:var(--glass);font:inherit;font-size:12px;font-weight:700;color:var(--sec);padding:7px 10px;border-radius:8px;cursor:pointer}
@media (max-width:1180px){.panel{display:none}.app{grid-template-columns:232px minmax(0,1fr)}}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="ctlbar"><button onclick="toggleTheme()">Day / Night</button><button onclick="S.panelOpen=!S.panelOpen;render()">Toggle conversation panel</button><button onclick="resetAll()">Reset</button></div>
<script>
const S0=()=>({theme:'day',screen:'today',panel:'wolf',panelOpen:true,actSeg:'live',actView:'table',filt:'all',sheet:null,seal:null,sealState:'open',
  madrid:{stageIx:1,t:1,ready:false,decided:false,approved:false,exec:0,prep:{ix:0,t:0,done:false}}, pay:{decided:false}, area:'trips'});
let S=S0();
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function toggleTheme(){S.theme=S.theme==='day'?'night':'day';render()}
function resetAll(){S=S0();render()}
const night=()=>S.theme==='night';
const IDM={wolf:'<i class="idm wolf"></i>',conc:'<i class="idm conc"></i>',gabi:'<i class="idm gabi">G</i>'};
/* live progress (FD-14) */
const STAGES=[{label:'Experts working',next:'Mr. Wolf review',kind:'eta',eta:7,over:3},{label:'Mr. Wolf reviewing',next:'Re-orchestration',kind:'est',estFor:3,eta:5},{label:'Re-orchestration',next:'Treasury check',kind:'unk',dep:'Legal Expert',dur:7},{label:'Treasury checking',next:'Ready to discuss',kind:'eta',eta:2}];
function stageText(){const m=S.madrid,st=STAGES[m.stageIx];if(m.ready)return{stage:'Ready to discuss',next:'',eta:''};if(st.kind==='eta'){const l=st.eta-m.t;return l>0?{stage:st.label,next:'Next: '+st.next,eta:'~'+l+' min'}:{stage:st.label,next:'Taking longer than estimated',eta:'re-estimating'}}if(st.kind==='est'){if(m.t<st.estFor)return{stage:st.label,next:'Next: '+st.next,eta:'estimating time'};return{stage:st.label,next:'Next: '+st.next,eta:'~'+Math.max(st.eta-(m.t-st.estFor),1)+' min'}}return{stage:st.label+' · waiting for '+st.dep,next:'Next: '+st.next,eta:'ETA unknown'}}
function progress(){const m=S.madrid;if(m.ready)return 100;const st=STAGES[m.stageIx];const tot=st.kind==='eta'?st.eta+(st.over||0):st.kind==='est'?st.estFor+st.eta:st.dur;return Math.min(99,Math.round(m.stageIx/STAGES.length*100+Math.min(m.t,tot)/tot*(100/STAGES.length)))}
const PREP=[{label:'Concierge orchestrating preparation',next:'Travel preparing the booking',eta:2},{label:'Travel preparing the exact booking',next:'Treasury re-check',eta:3},{label:'Treasury re-checking',next:'Seal ready',eta:2}];
function prepText(){const q=S.madrid.prep;if(q.done)return{stage:'Seal ready',next:'Waiting for your authorization',eta:''};const st=PREP[q.ix];const l=st.eta-q.t;return{stage:st.label,next:'Next: '+st.next,eta:l>0?'~'+l+' min':'re-estimating'}}
function prepProgress(){const q=S.madrid.prep;if(q.done)return 100;const tot=PREP.reduce((a,b)=>a+b.eta,0);const d=PREP.slice(0,q.ix).reduce((a,b)=>a+b.eta,0)+Math.min(q.t,PREP[q.ix].eta);return Math.round(d/tot*100)}
setInterval(()=>{const m=S.madrid;if(!m.ready){const st=STAGES[m.stageIx];m.t++;const tot=st.kind==='eta'?st.eta+(st.over||0):st.kind==='est'?st.estFor+st.eta:st.dur;if(m.t>tot){m.stageIx++;m.t=0;if(m.stageIx>=STAGES.length){m.ready=true;render();toast('Madrid plan is ready to discuss');return}}}
  else if(m.decided&&!m.approved&&!m.prep.done){const q=m.prep;q.t++;if(q.t>PREP[q.ix].eta){q.ix++;q.t=0;if(q.ix>=PREP.length){q.done=true;render();toast('Seal ready · your authorization is needed');return}}}
  const x=stageText(),p=progress(),y=prepText(),pp=prepProgress();
  document.querySelectorAll('[data-live=stage]').forEach(e=>e.textContent=x.stage);document.querySelectorAll('[data-live=next]').forEach(e=>e.textContent=x.next);document.querySelectorAll('[data-live=eta]').forEach(e=>e.textContent=x.eta);document.querySelectorAll('[data-live=bar]').forEach(e=>e.style.width=p+'%');
  document.querySelectorAll('[data-prep=stage]').forEach(e=>e.textContent=y.stage);document.querySelectorAll('[data-prep=next]').forEach(e=>e.textContent=y.next);document.querySelectorAll('[data-prep=eta]').forEach(e=>e.textContent=y.eta);document.querySelectorAll('[data-prep=bar]').forEach(e=>e.style.width=pp+'%');
},1500);
function go(s,extra){S.screen=s;if(extra)Object.assign(S,extra);S.sheet=null;S.seal=null;render()}
function openPanel(p){S.panel=p;S.panelOpen=true;render()}
function openSheet(id){S.sheet=id;render()}
function openSeal(k){S.seal=k||'ek141';S.sealState='open';render()}
function choose(){S.madrid.decided=true;S.madrid.prep={ix:0,t:0,done:false};S.panel='room-madrid';render()}
function approve(){S.madrid.approved=true;S.madrid.prep.done=true;S.madrid.exec=1;S.sealState='approved';render()}

/* ---------- rail ---------- */
function canon(){const m=S.madrid,items=[];items.push({id:'manoj',needs:true});items.push({id:'alnoor',ready:!S.pay.decided});
  if(m.approved&&m.exec>=4) items.push({id:'madrid',term:true}); else items.push({id:'madrid',ready:m.ready&&!m.decided,needs:m.decided&&m.prep.done&&!m.approved});
  items.push({id:'seat7k'},{id:'notes'},{id:'car'},{id:'vat'});const live=items.filter(i=>!i.term);
  return{needs:live.filter(i=>i.needs).length,ready:live.filter(i=>i.ready).length,moving:live.length,handled:live.filter(i=>!i.needs&&!i.ready).length}}
function cntLabel(){const c=canon();return night()?'quiet':`${c.moving} moving`}
function rail(){const cur=S.screen;const cnt=cntLabel();return `<nav class="rail">
 <div class="mark"><span class="dot"></span>reAI</div>
 <button aria-current="${cur==='today'?'page':'false'}" onclick="go('today')">Today</button>
 <h6>Conversations</h6>
 <button aria-current="${S.panelOpen&&S.panel==='wolf'?'page':'false'}" onclick="openPanel('wolf')">${IDM.wolf}Mr. Wolf</button>
 <button aria-current="${S.panelOpen&&S.panel==='conc'?'page':'false'}" onclick="openPanel('conc')">${IDM.conc}Master Concierge</button>
 <div class="sub"><button aria-current="${S.panelOpen&&S.panel==='room-pay'?'page':'false'}" onclick="openPanel('room-pay')">Al Noor payment<span class="n">room</span></button>
 ${S.madrid.ready?`<button aria-current="${S.panelOpen&&S.panel==='room-madrid'?'page':'false'}" onclick="openPanel('room-madrid')">Madrid trip<span class="n">room</span></button>`:''}</div>
 <button aria-current="${cur==='activity'?'page':'false'}" onclick="go('activity')">Activity<span class="n">${cnt}</span></button>
 <button aria-current="${cur==='inside'?'page':'false'}" onclick="go('inside')">Inside reAI</button>
 <h6>Areas</h6>
 <div class="sub"><button aria-current="${cur==='area'&&S.area==='work'?'page':'false'}" onclick="go('area',{area:'work'})">Work</button><button aria-current="${cur==='area'&&S.area==='money'?'page':'false'}" onclick="go('area',{area:'money'})">Money</button><button aria-current="${cur==='area'&&S.area==='family'?'page':'false'}" onclick="go('area',{area:'family'})">Family</button><button aria-current="${cur==='area'&&S.area==='life'?'page':'false'}" onclick="go('area',{area:'life'})">Life</button><button aria-current="${cur==='area'&&S.area==='trips'?'page':'false'}" onclick="go('area',{area:'trips'})">Madrid · trip<span class="n">1–4 Oct</span></button></div>
 <div class="spacer"></div>
 <button aria-current="${cur==='you'?'page':'false'}" onclick="go('you')"><span class="avatar" style="width:22px;height:22px;font-size:10px">G</span>You</button>
 <div class="foot">Desktop Prototype 001 r3 · CP-2 defect corrections (D-DS-02…06, 10) · sample data</div></nav>`}
function topBar(title){const cnt=cntLabel();return `<div class="top"><div class="meta">${night()?'Monday 28 September · Dubai 23:12':'Monday 28 September · Dubai 07:42'}</div><div style="display:flex;gap:10px;align-items:center"><button class="ring" onclick="go('activity')"><i></i>Activity <span class="cnt">· ${cnt}</span></button><div class="avatar" onclick="go('you')">G</div></div></div>`}

/* ---------- TODAY ---------- */
function today(){const n=night(),m=S.madrid;
 const c=canon();const sit=n?'Nothing needs you tonight.':`${c.needs} thing${c.needs===1?'':'s'} need${c.needs===1?'s':''} you.${c.ready?` ${c.ready} plan${c.ready===1?' is':'s are'} ready to discuss.`:''}`;
 let rows='';
 if(!n){
  rows+=`<div class="row halo" onclick="toast('Reply drafted · nothing sent until you approve')"><span class="pill p-amber">Action required</span><div class="t"><b>Manoj · V1 architecture sign-off</b><span>Reply drafted · reply today</span><span class="why2"><b>If nothing happens</b> Manoj's team waits; V1 slips a day.</span></div><span class="chev">›</span></div>`;
  rows+=`<div class="row" onclick="openPanel('room-pay')"><span class="pill p-ready">Ready to discuss</span><div class="t"><b>Al Noor payment · AED 18,400</b><span>Reviewed by Mr. Wolf · Treasury checked</span><span class="why2"><b>Why you</b> New beneficiary; the bank details are unverified.</span></div><span class="chev">›</span></div>`;
  if(m.ready&&!m.decided)rows+=`<div class="row" onclick="openPanel('room-madrid')"><span class="pill p-ready">Ready to discuss</span><div class="t"><b>Madrid plan · flights and hotel</b><span>2 review passes · Treasury checked</span><span class="why2"><b>Deadline</b> EK141 fare quote valid until Wed 18:00.</span></div><span class="chev">›</span></div>`;
  if(m.decided&&!m.approved)rows+=m.prep.done?`<div class="row halo" onclick="openSeal('ek141')"><span class="pill p-amber">Action required</span><div class="t"><b>Book EK141 · AED 9,870</b><span>Seal ready · fare quote valid until 18:00</span><span class="why2"><b>If nothing happens</b> The fare quote expires at 18:00 and is re-checked; nothing is held.</span></div><span class="chev">›</span></div>`:`<div class="row" onclick="openSheet('madrid')"><span class="pill p-blue">Working</span><div class="t"><b>EK141 · preparing for approval</b><span data-prep="stage">${prepText().stage}</span></div><div class="why"><b>Next</b><span data-prep="next">${prepText().next}</span></div><span class="chev">›</span></div>`;
 } else rows+=`<div class="row" onclick="openSheet('madrid')"><span class="pill p-green">Done</span><div class="t"><b>Hotel Urso · 1–4 Oct verified</b><span>Confirmed with the provider at 21:40</span></div><span class="chev">›</span></div>`;
 const x=stageText();
 const live=(!n&&!m.ready)?`<div class="sec"><h4>In preparation</h4><div class="paper live" onclick="openSheet('madrid')"><div class="h"><b>Madrid trip · 1–4 Oct</b><span class="pill p-blue">Working</span></div><div class="stage" data-live="stage">${x.stage}</div><div class="bar"><i data-live="bar" style="width:${progress()}%"></i></div><div class="next"><b data-live="next">${x.next}</b><span data-live="eta">${x.eta}</span></div></div></div>`:'';
 const left=`<div class="paper">${rows}</div>${live}<div class="reassure" onclick="go('activity')">${n?'<b>Quiet hours from 23:00</b> · only safety, security and travel disruption will reach you':'<b>reAI is handling '+canon().handled+'</b> · nothing committed without you ›'}</div>
  <div class="entry"><button onclick="openPanel('wolf')"><i class="idm wolf"></i>Plan with Wolf</button><button onclick="openPanel('conc')"><i class="idm conc"></i>Ask the Concierge</button><button class="mic" aria-label="Voice" onclick="toast('Voice: name Wolf or the Concierge; otherwise reAI asks once.')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>`;
 const right=n?`<div class="sec"><h4>Today, verified</h4><div class="paper list"><div class="li"><span class="ok">✓</span><span class="v">EK141 booked and verified with Emirates · 08:19</span></div><div class="li"><span class="ok">✓</span><span class="v">Hotel Urso verified · 21:40</span></div><div class="li"><span class="ok">✓</span><span class="v">Dinner with Karina · table confirmed</span></div></div></div>`:
 `<div class="sec" style="margin-top:0"><h4>What changed since you last looked</h4><div class="paper list"><div class="li"><span class="k">Money</span><span class="v">Al Noor invoice: bank details arrived by email — <span class="flag">Unverified</span></span></div><div class="li"><span class="k">Travel</span><span class="v">EK141 fare re-checked 07:38 · unchanged</span></div></div></div>
  <div class="sec"><h4>Moving</h4><div class="paper list"><div class="li"><span class="k">Today</span><span class="v">09:30 Manoj · architecture review<br>16:00 Investor call · notes ready by 15:00<br>19:30 Dinner with Karina · <span class="ok">✓ verified</span></span></div><div class="li"><span class="k">Money</span><span class="v">Visa ending 4417 · statement due Thursday · AED 12,300</span></div><div class="li"><span class="k">Travel</span><span class="v">Madrid 1–4 Oct · Hotel Urso <span class="ok">✓ verified</span></span></div><div class="li"><span class="k">Family</span><span class="v">Nothing clashes with the Madrid trip</span></div><div class="li"><span class="k">Work</span><span class="v">reAI V1 · reconciliation ready · review 09:30</span></div></div></div>
  <div class="sec"><h4>Upcoming</h4><div class="paper list"><div class="li"><span class="k">Wed</span><span class="v">EK141 fare quote valid until 18:00 · re-checked then</span></div><div class="li"><span class="k">Thu</span><span class="v">Visa statement due · AED 12,300</span></div></div></div>
  <div class="sec"><h4>Deliberately not here · reAI is handling these</h4><div class="paper list"><div class="li"><span class="pill p-indigo">Unknown</span><span class="v">Seat 7K on EK141 · Emirates didn't confirm · nothing for you before 13:00</span></div><div class="li"><span class="pill p-stone">Waiting</span><span class="v">Garage · reply promised by 12:00</span></div></div></div>
  <div class="sec"><h4>Since you last looked</h4><div class="paper list"><div class="li"><span class="ok">✓</span><span class="v">Hotel Urso verified with the provider · 07:12</span></div><div class="li"><span class="ok">✓</span><span class="v">6 receipts filed to the Vault · internal</span></div></div></div>`;
 return `${topBar()}<div class="greet">${n?'Good evening, Gabriele.':'Good morning, Gabriele.'}</div><div class="sit">${sit}</div><div class="sit2">${n?'Everything else is moving.':'Everything else is moving · 1 outcome being confirmed.'}</div><div class="cols"><div>${left}</div><div>${right}</div></div>`}

/* ---------- ACTIVITY ---------- */
function activity(){const m=S.madrid,x=stageText();
 const items=[
  {o:'Seat 7K on EK141',s:'Unknown',c:'p-indigo',r:'Travel',step:'Emirates did not confirm · not retrying',ev:'Request 07:12 · no confirmation',next:'Ask you at 13:00 if still unknown',area:'Trip'},
  {o:'Madrid trip · 1–4 Oct',s:m.approved?(m.exec>=4?'Done':m.exec===3?'Unknown':'Executing'):'Working',c:m.approved?(m.exec>=4?'p-green':m.exec===3?'p-indigo':'p-ink'):'p-blue',r:'Wolf · Concierge · Travel, Legal',step:m.approved?'Approved 08:12 · not done until verified':m.decided?prepText().stage:x.stage,ev:m.ready?'2 review passes · Treasury 08:06':'—',next:m.decided?prepText().next:x.next,area:'Trip',id:'madrid'},
  {o:'Al Noor payment · AED 18,400',s:S.pay.decided?'Waiting':'Working',c:S.pay.decided?'p-stone':'p-blue',r:'Concierge · Finance, Legal · Wolf review',step:S.pay.decided?'Verifying bank details by phone':'Ready to discuss',ev:'Treasury 07:57 · new beneficiary',next:S.pay.decided?'Al Noor callback':'Your decision',area:'Money'},
  {o:'Investor call notes',s:'Working',c:'p-blue',r:'Concierge · Documents',step:'Draft in progress',ev:'—',next:'Draft ready by 15:00',area:'Work'},
  {o:'Car service',s:'Waiting',c:'p-stone',r:'Life · Local',step:'Garage promised a reply by 12:00',ev:'Request sent Sun 11:04',next:'Inbox check 12:15',area:'Life'},
  {o:'Q3 VAT document pack',s:'Queued',c:'p-stone',r:'Documents',step:'Not started',ev:'—',next:'After the lease review',area:'Money'}];
 const hist=[{o:'Hotel Urso · 1–4 Oct',s:'Done',c:'p-green',r:'Travel',step:'Verified 07:12',ev:'Provider confirmation',next:'Free cancellation watched to 30 Sep',area:'Trip'},{o:'6 receipts filed to the Vault',s:'Done',c:'p-green',r:'Documents',step:'Filed',ev:'Files re-read in place',next:'—',area:'Money'},{o:'Dinner table · 19:30',s:'Done',c:'p-green',r:'Life',step:'Confirmed',ev:'Confirmation matched',next:'—',area:'Family'},{o:'Fare check · Air France',s:'Failed',c:'p-red',r:'Travel',step:'Provider timed out · nothing moved',ev:'Timeout 07:20',next:'Safe to re-run',area:'Trip'},{o:'Qatar via Doha · Wed',s:'Rejected',c:'p-stone',r:'—',step:'Rejected by you yesterday 21:04',ev:'Nothing booked',next:'—',area:'Trip'}];
 const data=(S.actSeg==='live'?items:hist).filter(i=>S.filt==='all'||i.s===S.filt);
 const table=`<div class="paper tblwrap"><table><thead><tr><th>Outcome</th><th>State</th><th>Roles</th><th>Current step</th><th>Evidence</th><th>Next</th></tr></thead><tbody>${data.map(i=>`<tr class="click" onclick="${i.id?"openSheet('madrid')":"toast('Outcome detail (sample)')"}"><td><b>${i.o}</b><br><span style="font-size:12px;color:var(--sec)">${i.area}</span></td><td><span class="pill ${i.c}">${i.s}</span></td><td style="color:var(--sec)">${i.r}</td><td>${i.step}</td><td class="mono">${i.ev}</td><td>${i.next}</td></tr>`).join('')}</tbody></table></div>`;
 const list=`<div class="paper">${data.map(i=>`<div class="row" onclick="${i.id?"openSheet('madrid')":"toast('Outcome detail (sample)')"}"><span class="pill ${i.c}">${i.s}</span><div class="t"><b>${i.o}</b><span>${i.step}</span></div><span class="chev">›</span></div>`).join('')}</div>`;
 return `${topBar()}<h1 class="pg">Activity</h1><div class="lead">Every outcome, where it stands, and what proves it.</div>
 <div class="filters"><div class="seg"><button aria-pressed="${S.actSeg==='live'}" onclick="S.actSeg='live';S.filt='all';render()">Live</button><button aria-pressed="${S.actSeg==='hist'}" onclick="S.actSeg='hist';S.filt='all';render()">History</button></div>
 <span style="width:10px"></span>${['all','Working','Waiting','Queued','Unknown','Done','Failed'].map(f=>`<button class="chip" aria-pressed="${S.filt===f}" onclick="S.filt='${f}';render()">${f==='all'?'All':f}</button>`).join('')}
 <span style="flex:1"></span><div class="seg"><button aria-pressed="${S.actView==='table'}" onclick="S.actView='table';render()">Table</button><button aria-pressed="${S.actView==='list'}" onclick="S.actView='list';render()">List</button></div></div>
 ${S.actView==='table'?table:list}`}

function inside(){
 const c=night()?'#EEF1F3':'#0E1418',sec=night()?'#B7C0C7':'#3F4B53',paper=night()?'#1C2129':'#FFFFFF',hair=night()?'rgba(238,241,243,.14)':'rgba(14,20,24,.12)',amber=night()?'#E3A264':'#9A4A0B';
 const box=(x,y,w,h,t1,t2,strong)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${strong?c:paper}" stroke="${hair}"/><text x="${x+w/2}" y="${y+h/2-4}" text-anchor="middle" font-size="14" font-weight="700" fill="${strong?paper:c}">${t1}</text><text x="${x+w/2}" y="${y+h/2+15}" text-anchor="middle" font-size="13" fill="${strong?paper:sec}">${t2}</text>`;
 const map=`<svg viewBox="0 0 980 420">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${sec}"/></marker></defs>
  ${box(400,16,180,56,'Gabi · Founder','decides · authorizes',true)}
  <path d="M440 72 C 380 120, 300 120, 250 140" fill="none" stroke="${sec}" stroke-width="1.5" marker-end="url(#a)"/><text x="300" y="104" font-size="13" fill="${sec}">plan with Wolf</text>
  <path d="M540 72 C 600 120, 680 120, 730 140" fill="none" stroke="${sec}" stroke-width="1.5" marker-end="url(#a)"/><text x="600" y="104" font-size="13" fill="${sec}">ask the Concierge</text>
  ${box(120,140,230,64,'Mr. Wolf','planning partner · global review')}
  ${box(630,140,230,64,'Master Concierge','orchestration · synthesis · preparation (FD-20)')}
  <path d="M350 160 L 630 160" fill="none" stroke="${sec}" stroke-width="1.5" marker-end="url(#a)"/><text x="490" y="152" text-anchor="middle" font-size="13" fill="${sec}">request</text>
  <path d="M630 186 L 350 186" fill="none" stroke="${sec}" stroke-width="1.5" marker-end="url(#a)"/><text x="490" y="204" text-anchor="middle" font-size="13" fill="${sec}">results for global review</text>
  <rect x="380" y="232" width="220" height="44" rx="12" fill="none" stroke="${amber}" stroke-dasharray="4 3"/><text x="490" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="${amber}">Working room · three-way discussion</text><text x="490" y="266" text-anchor="middle" font-size="13" fill="${sec}">Gabi + Wolf + Concierge → Founder decision</text>
  <path d="M235 204 L 400 240" fill="none" stroke="${amber}" stroke-width="1.2"/><path d="M745 204 L 580 240" fill="none" stroke="${amber}" stroke-width="1.2"/><path d="M490 72 L 490 232" fill="none" stroke="${amber}" stroke-width="1.2" stroke-dasharray="3 3"/>
  ${box(640,240,100,44,'Treasury','financial control')}
  <path d="M745 204 L 700 240" fill="none" stroke="${hair}" stroke-width="1.5"/>
  ${['Travel','Legal','Finance','Documents','Home'].map((e,i)=>box(532+i*90,312,84,44,e,'Expert')).join('')}
  <path d="M745 204 L 745 312" fill="none" stroke="${hair}" stroke-width="1.5"/>
  ${['Scouts','Verifiers','Bookers','Filers'].map((e,i)=>box(556+i*104,370,96,40,e,'machinery')).join('')}
  <text x="120" y="330" font-size="13.5" font-weight="700" fill="${c}">Reading the map</text>
  <text x="120" y="350" font-size="13" fill="${sec}">Two entry points. Not a reporting tree.</text><text x="120" y="366" font-size="13" fill="${sec}">Anything moving toward action passes Wolf's global review.</text><text x="120" y="382" font-size="13" fill="${sec}">Only Gabi decides and authorizes. No agent can approve, pay, send or book.</text>
 </svg>`;
 return `${topBar()}<h1 class="pg">Inside reAI</h1><div class="lead">Who is working on what, and how work travels — operational depth behind the calm surface.</div>
 <div class="paper map">${map}</div>

  <div style="display:flex;justify-content:space-between;align-items:center"><span class="pill p-amber">Action required · step 1 of 2</span><button class="btn b-out sm" onclick="S.seal=null;render()">Close</button></div>

/* ---------- render ---------- */
function fitMain(){const a=$('#app'),m=document.querySelector('.main');if(!m)return;const w=m.clientWidth;a.classList.toggle('narrow',w<780);a.classList.toggle('tight',w<520)}
window.addEventListener('resize',fitMain);
function render(){document.body.classList.toggle('night',night());let main='';switch(S.screen){case 'today':main=today();break;case 'activity':main=activity();break;case 'inside':main=inside();break;case 'area':main=area();break;case 'you':main=you();break;default:main=today()}
 $('#app').innerHTML=rail()+`<main class="main">${main}</main>`+panel()+sheet()+seal();fitMain()}
render();
</script>
